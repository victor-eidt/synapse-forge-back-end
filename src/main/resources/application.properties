# Na nuvem, SPRING_DATA_MONGODB_URI substitui este valor (o nome do banco vai no caminho da URI)
spring.data.mongodb.uri=mongodb://localhost:27017/synapse-forge
# O Render injeta a porta em PORT; local continua 8081
server.port=${PORT:8081}
# Atrás do proxy do Render: o Tomcat lê X-Forwarded-For/Proto de proxies internos, para o
# RateLimitFilter ver o IP real do cliente (e não o do proxy). Sem proxy, nada muda.
server.forward-headers-strategy=native
spring.application.name=synapse-forge-db

# Carrega credenciais locais (gitignored). optional: nao falha se ausente.
spring.config.import=optional:classpath:application-secrets.properties

# ===== UPLOAD =====
# Padrao do Spring e 1MB por arquivo, insuficiente para fotos reais
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# ===== EMAIL =====
# As credenciais (username/password) ficam em application-secrets.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sem timeout o JavaMail espera para sempre se a porta SMTP estiver bloqueada (o plano free do
# Render bloqueia 25/465/587): a requisicao de cadastro ficaria presa. 10 s e desiste.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.url=${APP_URL:http://localhost:5173}
app.mail.from=${spring.mail.username:no-reply@synapseforge.local}

# ===== CORS =====
# Comma-separated list of allowed origins. Wildcards (*) are supported.
# Override per environment via the APP_CORS_ALLOWED_ORIGINS env var, e.g.:
#   APP_CORS_ALLOWED_ORIGINS=https://app.empresa.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===== ADMIN =====
app.admin.emails=${APP_ADMIN_EMAILS:}

# ===== JWT =====
# Segredo de assinatura dos tokens, em Base64 (minimo 32 bytes). Obrigatorio: sem ele a
# aplicacao nao sobe. Gere com `openssl rand -base64 32` e coloque em
# application-secrets.properties (local) ou na variavel APP_JWT_SECRET (servidor).
# Trocar o valor desloga todo mundo.
app.jwt.secret=${APP_JWT_SECRET:}

# ===== SWAGGER / OPENAPI =====
# Ligado por padrao para desenvolvimento local. Em producao, desligue com
# APP_SWAGGER_ENABLED=false para nao expor o mapa da API publicamente.
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:true}
# Organização da página: grupos (tags) em ordem alfabética, endpoints por método,
# tudo recolhido ao abrir e tempo de resposta visível no "Try it out".
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true

# ===== DADOS DE TESTE =====
# Cria usuarios (senha 1234), equipe e cores de teste na inicializacao.
# Em producao, desligue com APP_SEED_ENABLED=false.
app.seed.enabled=${APP_SEED_ENABLED:true}
# Pedidos e materiais ficticios do dashboard (SYN-164); so rodam com APP_SEED_ENABLED ligado.
app.seed.dashboard-mocks=${APP_SEED_DASHBOARD_MOCKS:true}

# JSON Schema ($jsonSchema) nas colecoes pedidos, orcamentos, ordens_pintura, movimentos_estoque e comentarios
# action: error = rejeita documento invalido | warn = so registra no log do MongoDB
app.mongo.schema-validation.enabled=${APP_MONGO_SCHEMA_VALIDATION_ENABLED:true}
app.mongo.schema-validation.action=${APP_MONGO_SCHEMA_VALIDATION_ACTION:error}

# ===== HEALTH CHECK (SYN-89) =====
# So o /actuator/health fica exposto, e so com o status geral ({"status":"UP"}): nada de
# componentes, detalhes ou outros endpoints do Actuator. O Render usa para saber se o deploy subiu.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# O indicador de e-mail abriria uma conexao SMTP a cada health check; o do MongoDB fica
management.health.mail.enabled=false
