# CI do back-end (SYN-86). Roda em todo PR e em todo push para dev e main.
# O gate é o PR: compilação e toda a suíte de testes (inclusive o contextLoads com
# Mongo embutido) precisam passar antes do merge.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: sh ./mvnw -B verify
